name: Publish to JSR

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run fmt:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check compiled Node entrypoints
        run: pnpm run build:check

      - name: Run unit tests
        run: pnpm test

      - name: Run DOM integration tests
        run: pnpm run test:dom

      - name: Enforce browser size budgets
        run: pnpm run size

      - name: Install browsers
        run: pnpm run browsers:install

      - name: Test native forms and streamed panels in browsers
        run: pnpm run test:browser

  publish:
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish
