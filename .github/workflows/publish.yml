name: Publish to JSR

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.8

      - name: Check formatting
        run: deno task fmt:check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno task typecheck

      - name: Run unit tests
        run: deno task test

      - name: Run DOM integration tests
        run: deno task test:dom

  publish:
    runs-on: ubuntu-latest
    needs: validate

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Publish to JSR
        run: npx --yes jsr@0.14.3 publish
