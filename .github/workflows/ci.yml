name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Deno
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.8

      - name: Check formatting
        run: deno task fmt:check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno task typecheck

      - name: Run unit tests
        run: deno task test

      - name: Run DOM integration tests
        run: deno task test:dom

      - name: Enforce browser size budgets
        run: deno task size

      - name: Install browsers
        run: deno task browsers:install

      - name: Test native forms and streamed panels in browsers
        run: deno task test:browser
